services:
  music-machine:
    volumes:
      - ./data:/data
      - /mnt/nas/music:/music
      - /mnt/music_dupes:/trash
      - ./staging:/staging

  sonic-analyzer:
    volumes:
      - ./data:/data
      - /mnt/nas/music:/music:ro

  lossless-analyzer:
    build:
      context: .
      dockerfile: lossless-analyzer/Dockerfile
    container_name: lossless-analyzer
    volumes:
      - ./data:/data
      - /mnt/nas/music:/music
    environment:
      - MUSICGRABBER_URL=http://10.0.0.13:38274
      - DB_PATH=/data/music-machine.db
      - MUSIC_PATH=/music
    restart: unless-stopped
    depends_on:
      - music-machine
